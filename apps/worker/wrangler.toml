name = "x-harness-worker"
main = "src/index.ts"
compatibility_date = "2026-07-23"
workers_dev = false

# Secrets are provisioned per environment with Wrangler and never stored here.

[env.staging]
name = "x-harness-worker-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
WORKER_URL = "https://x-harness-worker-staging.yoshihiro-fukiya.workers.dev"
CUBELIC_SAFE_MODE = "true"
CUBELIC_PHASE3_ENABLED = "true"
CUBELIC_PHASE3_DELIVERY_MODE = "staging_fake"
CUBELIC_PHASE3_MEDIA_ENABLED = "true"
CUBELIC_PHASE3_MEDIA_SMOKE_MODE = "true"
CUBELIC_PHASE3_SCHEDULE_POLICIES = "event_notice:event_notice_manual_v1"
CUBELIC_HUMAN_INTERACTIONS_ENABLED = "false"
CUBELIC_HUMAN_INTERACTIONS_SMOKE_MODE = "false"
PHASE3_RELEASE_APPROVED = "true"
STAGING_PHASE3_SMOKE_VERIFIED = "true"
STAGING_PHASE3_MEDIA_SMOKE_VERIFIED = "false"
MEDIA_RETENTION_POLICY_VERIFIED = "false"
HUMAN_INTERACTIONS_RELEASE_APPROVED = "false"
STAGING_HUMAN_INTERACTIONS_SMOKE_VERIFIED = "false"
GLOBAL_PUBLISHING_DISABLED = "false"
X_HARNESS_ACCOUNT_ID = "staging-inert-account"
CORS_ALLOWED_ORIGINS = "https://cubelic-fan-staging.pages.dev"
LINE_CONNECTION_ALLOWED_HOSTS = ""
CREDENTIAL_ENCRYPTION_KEY_VERSION = "2026-07-23-v1"
INTERACTION_FINGERPRINT_KEY_VERSION = "2026-07-24-v1"

[env.staging.triggers]
crons = [ "*/5 * * * *" ]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "x-harness-staging"
database_id = "7a58b4f9-a0ab-42d9-8357-5862802fe74f"

[[env.staging.r2_buckets]]
binding = "GROWTH_IMAGES"
bucket_name = "x-harness-growth-images-staging"

[[env.staging.r2_buckets]]
binding = "CUBELIC_MEDIA"
bucket_name = "x-harness-publication-media-staging"

[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"

[env.staging.ratelimits.simple]
limit = 30
period = 60

[[env.staging.ratelimits]]
name = "PUBLIC_ACTION_RATE_LIMITER"
namespace_id = "1003"

[env.staging.ratelimits.simple]
limit = 60
period = 60

[env.production]
name = "x-harness-worker-production"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "api.cubelic-fan.com", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
WORKER_URL = "https://api.cubelic-fan.com"
CUBELIC_SAFE_MODE = "true"
CUBELIC_PHASE3_ENABLED = "true"
CUBELIC_PHASE3_DELIVERY_MODE = "x"
CUBELIC_PHASE3_MEDIA_ENABLED = "false"
CUBELIC_PHASE3_MEDIA_SMOKE_MODE = "false"
CUBELIC_PHASE3_SCHEDULE_POLICIES = "event_notice:event_notice_manual_v1"
CUBELIC_HUMAN_INTERACTIONS_ENABLED = "false"
CUBELIC_HUMAN_INTERACTIONS_SMOKE_MODE = "false"
PHASE3_RELEASE_APPROVED = "true"
STAGING_PHASE3_SMOKE_VERIFIED = "true"
STAGING_PHASE3_MEDIA_SMOKE_VERIFIED = "false"
MEDIA_RETENTION_POLICY_VERIFIED = "false"
HUMAN_INTERACTIONS_RELEASE_APPROVED = "false"
STAGING_HUMAN_INTERACTIONS_SMOKE_VERIFIED = "false"
GLOBAL_PUBLISHING_DISABLED = "false"
X_HARNESS_ACCOUNT_ID = "89f9bfc0-428c-480b-9cb3-9ba1698c30da"
CORS_ALLOWED_ORIGINS = "https://ops.cubelic-fan.com"
LINE_CONNECTION_ALLOWED_HOSTS = ""
CREDENTIAL_ENCRYPTION_KEY_VERSION = "2026-07-23-v1"
INTERACTION_FINGERPRINT_KEY_VERSION = "2026-07-24-v1"

[env.production.triggers]
crons = [ "*/5 * * * *" ]

[[env.production.d1_databases]]
binding = "DB"
database_name = "x-harness-production"
database_id = "ef612e3b-60bf-425f-9dc3-ad0e11d13798"

[[env.production.r2_buckets]]
binding = "GROWTH_IMAGES"
bucket_name = "x-harness-growth-images-production"

[[env.production.r2_buckets]]
binding = "CUBELIC_MEDIA"
bucket_name = "x-harness-publication-media-production"

[[env.production.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"

[env.production.ratelimits.simple]
limit = 30
period = 60

[[env.production.ratelimits]]
name = "PUBLIC_ACTION_RATE_LIMITER"
namespace_id = "1004"

[env.production.ratelimits.simple]
limit = 60
period = 60
